<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Averin Insights™ — Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal-500: #0F9080;
      --teal-400: #16A893;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: #EEF2F7;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 48px 40px 40px;
      box-shadow: 0 4px 24px rgba(15,23,42,.08), 0 1px 4px rgba(15,23,42,.04);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 36px;
    }

    .logo-wrap img {
      height: 38px;
    }

    .login-heading {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94A3B8;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #475569;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.9rem;
      color: #0F172A;
      outline: none;
      transition: border-color .15s, background .15s;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: #CBD5E1;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--teal-500);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(15,144,128,.1);
    }

    .btn-signin {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: var(--teal-500);
      border: none;
      border-radius: 8px;
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background .15s, transform .1s;
    }

    .btn-signin:hover  { background: var(--teal-400); }
    .btn-signin:active { transform: scale(.98); }

    .error-msg {
      margin-top: 16px;
      padding: 10px 14px;
      background: #FEF2F2;
      border: 1px solid #FCA5A5;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #B91C1C;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-wrap">
      <img src="/static/logo.png" alt="Averin Insights" />
    </div>

    <p class="login-heading">Portal Login</p>

    <form method="POST" action="/login">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@organization.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-signin">Sign In</button>
    </form>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
